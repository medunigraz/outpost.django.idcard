{% load i18n static %}{% get_current_language as LANGUAGE_CODE %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Digital ID Cards{% endblock %} - MedUni Graz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            color: #1a1a1a;
            background: #f3f5f4;
        }

        a { color: #007c31; }

        header { background: white; border-bottom: 1px solid #e3e8e5; }
        .header-inner {
            max-width: 560px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-logo { height: 44px; width: auto; display: block; }
        .header-title {
            flex: 1;
            min-width: 0;
            font-size: 15px;
            font-weight: 600;
            color: #4a4a4a;
            padding-left: 14px;
            border-left: 1px solid #e3e8e5;
        }

        .lang-switch-link {
            color: #007c31;
            text-decoration: none;
            border: 1px solid #cfe3d6;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 13px;
            white-space: nowrap;
        }
        .lang-switch-link:hover { background: #f2f9f5; border-color: #007c31; }

        main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.05);
        }
        .panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .panel p { color: #555; font-size: 15px; }

        .btn {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 20px;
            border-radius: 10px;
            background: #007c31;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
        .btn:hover { background: #00612a; }

        @media (max-width: 480px) {
            .header-logo { height: 36px; }
            .header-title { font-size: 14px; padding-left: 12px; }
            main { padding: 20px 16px 40px; }
            .panel { padding: 20px; }
        }
    </style>
    {% block extra_style %}{% endblock %}
</head>
<body>
    <header>
        <div class="header-inner">
            <img class="header-logo" src="{% static 'idcard/meduni-logo.png' %}" alt="MedUni Graz">
            <span class="header-title">{% block header %}Digital ID Cards{% endblock %}</span>
            {% block header_extra %}{% endblock %}
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
