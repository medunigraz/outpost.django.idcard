[project]
name = "outpost.django.idcard"
dynamic = ["version"]
description = "MUG API Backend - Digital ID Cards"
authors = [
    {name = "Medical University of Graz", email = "it@medunigraz.at"}
]
license = {text = "BSD"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django (>=4.2.23)",
    "django-appconf",
    "djangorestframework",
    "drf-flex-fields",
    "celery",
    "cryptography",
    "pillow",
    "qrcode[pil]",
    "google-auth[requests]",
]

[project.urls]
Repository = "https://github.com/medunigraz/outpost.django.idcard"

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"
multi_line_output = 3
force_grid_wrap = 2
force_to_top = false
line_length = 120
known_first_party = "outpost.django.idcard"
known_third_party = "django,outpost"
default_section = "THIRDPARTY"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags"
