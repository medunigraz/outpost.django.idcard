[metadata]
name = outpost.django.idcard
version = 0.1.0
description = Digital employee ID cards for Apple Wallet and Google Wallet
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/medunigraz/outpost.django.idcard
author = Medical University of Graz
author_email = it@medunigraz.at
license = BSD
license_files = LICENSE
classifiers =
    Framework :: Django
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3

[options]
packages = find_namespace:
package_dir =
    = src
namespace_packages =
    outpost
    outpost.django
python_requires = >=3.10
install_requires =
    Django>=5.0
    Pillow
    qrcode[pil]
    requests
    google-auth
    google-auth-oauthlib
    google-auth-httplib2
    google-api-python-client
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest
    pytest-django
    pytest-cov

[bdist_wheel]
universal = 0